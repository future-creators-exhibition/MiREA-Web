<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MiREA - Dream Map Installation</title>
        <link rel="stylesheet" href="scss/style.css" />
        <!-- p5.js ライブラリ -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
        <!-- QRコード生成ライブラリ -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    </head>
    <body>
        <main id="app">
            <div id="canvas-container"></div>

            <div id="ui-overlay">
                <div id="standby-guide" class="guide-box is-active">
                    <p class="en">HOLD YOUR HAND OVER THE SENSOR</p>
                    <p class="ja">センサーに手をかざして、昨日の夢をスキャン</p>
                </div>

                <div id="scanning-guide" class="guide-box">
                    <p class="en">SCANNING YOUR DREAM...</p>
                    <p class="ja">夢の断片を抽出しています...</p>
                </div>

                <div id="result-panel" class="result-panel">
                    <div class="qr-card">
                        <div id="qrcode"></div>
                        <div class="qr-text">
                            <p class="title">DREAM ARCHIVE</p>
                            <p class="desc">
                                スマートフォンで読み取り、<br />ドリームマップへ持ち帰る
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="system-status">
                <span id="serial-indicator"
                    >Serial: Disconnected (Press 'C')</span
                >
            </div>
        </main>

        <script src="js/sketch.js"></script>
    </body>
</html>
